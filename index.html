<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="油品决策">
  <title>原油汽柴油决策App｜一天多次记录版</title>
  <style>
    :root{--card:#101827;--line:#2c3a52;--text:#f8fafc;--muted:#93a4bb;--blue:#38bdf8;--green:#22c55e;--red:#ef4444;--yellow:#facc15;--orange:#fb923c}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#0f172a,#020617);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .wrap{max-width:540px;margin:0 auto;padding:14px 14px 96px}
    h1{font-size:22px;margin:14px 0 6px}.sub{color:var(--muted);font-size:13px;line-height:1.5}
    .card{background:rgba(16,24,39,.94);border:1px solid var(--line);border-radius:20px;padding:14px;margin:12px 0;box-shadow:0 10px 25px rgba(0,0,0,.22)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
    label{font-size:12px;color:var(--muted);display:block;margin:4px 0 6px}
    input,select,button{width:100%;border-radius:13px;border:1px solid var(--line);background:#020617;color:var(--text);padding:12px;font-size:16px;outline:none}
    input:focus,select:focus{border-color:var(--blue)}
    button{border:0;background:linear-gradient(135deg,#0284c7,#38bdf8);font-weight:800;color:white}
    button.secondary{background:#1f2937;color:#e5e7eb;border:1px solid var(--line)}button.danger{background:#7f1d1d}
    .hero{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:#020617;border:1px solid var(--line);border-radius:16px;padding:12px}
    .box .name{font-size:12px;color:var(--muted)}.box .val{font-size:25px;font-weight:900;margin-top:5px}.box .chg{font-size:13px;margin-top:2px}
    .score{font-size:54px;font-weight:1000;text-align:center;line-height:1}.decision{text-align:center;font-size:22px;font-weight:1000;margin-top:8px}.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:8px;line-height:1.55}
    .pill{display:inline-block;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.ok{background:rgba(34,197,94,.18);color:#86efac}.bad{background:rgba(239,68,68,.18);color:#fecaca}.flat{background:rgba(250,204,21,.15);color:#fde68a}.info{background:rgba(56,189,248,.16);color:#bae6fd}
    table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:9px 4px;text-align:center}th{color:var(--muted);font-weight:700}
    .small{font-size:12px;color:var(--muted);line-height:1.5}.hide{display:none}
    canvas{width:100%;height:210px;background:#020617;border:1px solid var(--line);border-radius:16px;margin-top:10px}
    .bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(2,6,23,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
    .bottom .inner{max-width:540px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
  </style>
</head>
<body>
<div class="wrap">
  <h1>原油汽柴油决策 App · 多次记录版</h1>
  <div class="sub">同一天可保存多次，自动记录具体时间，用来观察日内趋势。建议上午、下午、晚上各保存一次。</div>

  <div class="card">
    <div class="row">
      <div><label>日期</label><input id="date" type="date"></div>
      <div><label>记录时间</label><input id="time" type="time"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div><label>行情源</label><select id="source" onchange="saveAll(false)"><option value="yahoo">Yahoo公开行情</option><option value="stooq">Stooq公开行情</option></select></div>
      <div><label>趋势图指标</label><select id="chartMode" onchange="drawChart();saveAll(false)"><option value="score">总分趋势</option><option value="oil">原油价格</option><option value="avg">汽柴油均价</option><option value="crack">裂解差</option></select></div>
    </div>
    <div class="row" style="margin-top:10px"><button onclick="fetchOil()">自动抓原油</button><button class="secondary" onclick="toggleSettings()">参数设置</button></div>
    <div class="small" id="fetchStatus" style="margin-top:8px">一天可以多次保存；每条记录按“日期+时间”保存，不会覆盖当天早些时候的记录。</div>
  </div>

  <div id="settings" class="card hide">
    <div class="row"><div><label>汽油裂解强</label><input id="gasCrackHigh" type="number" value="18"></div><div><label>汽油裂解弱</label><input id="gasCrackLow" type="number" value="10"></div></div>
    <div class="row"><div><label>柴油裂解强</label><input id="dieselCrackHigh" type="number" value="22"></div><div><label>柴油裂解弱</label><input id="dieselCrackLow" type="number" value="12"></div></div>
    <div class="row"><div><label>产销强%</label><input id="ratioHigh" type="number" value="100"></div><div><label>产销弱%</label><input id="ratioLow" type="number" value="80"></div></div>
    <div class="row"><div><label>原油涨幅强%</label><input id="oilHigh" type="number" value="1.5"></div><div><label>原油跌幅强%</label><input id="oilLow" type="number" value="-1.5"></div></div>
    <button class="secondary" onclick="saveAll()" style="margin-top:10px">保存参数</button>
  </div>

  <div class="card">
    <div class="hero">
      <div class="box"><div class="name">WTI</div><div class="val" id="wtiShow">--</div><div class="chg" id="wtiChgShow">--</div></div>
      <div class="box"><div class="name">Brent</div><div class="val" id="brentShow">--</div><div class="chg" id="brentChgShow">--</div></div>
    </div>
    <div class="row" style="margin-top:10px"><div><label>WTI价格</label><input id="wti" type="number" step="0.01" oninput="calc()"></div><div><label>WTI涨跌幅%</label><input id="wtiPct" type="number" step="0.01" oninput="calc()"></div></div>
    <div class="row"><div><label>Brent价格</label><input id="brent" type="number" step="0.01" oninput="calc()"></div><div><label>Brent涨跌幅%</label><input id="brentPct" type="number" step="0.01" oninput="calc()"></div></div>
  </div>

  <div class="card">
    <div class="row"><div><label>汽油裂解差</label><input id="gasCrack" type="number" step="0.01" oninput="calc()"></div><div><label>柴油裂解差</label><input id="dieselCrack" type="number" step="0.01" oninput="calc()"></div></div>
    <div class="row"><div><label>汽油产销比%</label><input id="gasRatio" type="number" step="0.1" oninput="calc()"></div><div><label>柴油产销比%</label><input id="dieselRatio" type="number" step="0.1" oninput="calc()"></div></div>
    <div class="row"><div><label>汽油均价 元/吨</label><input id="gasAvgPrice" type="number" step="1" oninput="calc()"></div><div><label>柴油均价 元/吨</label><input id="dieselAvgPrice" type="number" step="1" oninput="calc()"></div></div>
    <div class="row"><div><label>调价预期 元/吨</label><input id="adjust" type="number" step="1" oninput="calc()"></div><div><label>消息面</label><select id="news" onchange="calc()"><option value="0">无明显消息 0</option><option value="2">利多 +2</option><option value="-2">利空 -2</option></select></div></div>
  </div>

  <div class="card">
    <div class="score" id="score">0</div><div class="decision" id="decision">观望</div><div class="hint" id="hint">填写数据后自动判断。</div>
    <div class="row3" style="margin-top:12px"><div class="box"><div class="name">机会等级</div><div id="chance" class="pill flat">一般</div></div><div class="box"><div class="name">风险等级</div><div id="risk" class="pill flat">中</div></div><div class="box"><div class="name">库存拐点</div><div id="turning" class="pill info">待观察</div></div></div>
  </div>

  <div class="card"><div style="font-weight:900">得分明细</div><table><thead><tr><th>项目</th><th>评分</th><th>说明</th></tr></thead><tbody id="scoreRows"></tbody></table></div>
  <div class="card"><div style="font-weight:900">日内/历史趋势</div><canvas id="chart" width="500" height="230"></canvas><div class="small">可切换总分、原油价格、汽柴油均价、裂解差。保存越多，趋势越清楚。</div></div>

  <div class="card">
    <div class="row"><button onclick="saveNow()">保存当前记录</button><button class="secondary" onclick="exportCsv()">导出CSV</button></div>
    <button class="danger" onclick="clearHistory()" style="margin-top:10px">清空历史记录</button>
  </div>

  <div class="card"><div style="font-weight:900;margin-bottom:8px">最近记录</div><table><thead><tr><th>时间</th><th>汽均</th><th>柴均</th><th>分数</th><th>策略</th></tr></thead><tbody id="history"></tbody></table></div>
</div>

<div class="bottom"><div class="inner"><button onclick="calc()">计算</button><button class="secondary" onclick="saveNow()">保存</button><button class="secondary" onclick="window.scrollTo({top:0,behavior:'smooth'})">顶部</button></div></div>

<script>
const $=id=>document.getElementById(id);
const storageKey="oilMultiHistory";
const stateKey="oilMultiState";
const keys=["date","time","source","chartMode","wti","wtiPct","brent","brentPct","gasCrack","dieselCrack","gasRatio","dieselRatio","gasAvgPrice","dieselAvgPrice","adjust","news","gasCrackHigh","gasCrackLow","dieselCrackHigh","dieselCrackLow","ratioHigh","ratioLow","oilHigh","oilLow"];
function num(id){const v=parseFloat($(id).value);return Number.isFinite(v)?v:null}
function fmt(v){return v===null||v===""||Number.isNaN(Number(v))?"--":Number(v).toFixed(2)}
function pct(v){return v===null||v===""||Number.isNaN(Number(v))?"--":Number(v).toFixed(2)+"%"}
function nowDate(){return new Date().toISOString().slice(0,10)}
function nowTime(){const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function recordStamp(){return ($("date").value||nowDate())+" "+($("time").value||nowTime())}
function scoreRange(value,high,low,hs=2,ls=-2){if(value===null)return 0;if(value>=high)return hs;if(value<=low)return ls;return 0}
function scoreAdjust(v){if(v===null)return 0;if(v>=50)return 1;if(v<=-50)return -1;return 0}
function history(){return JSON.parse(localStorage.getItem(storageKey)||"[]").sort((a,b)=>(b.stamp||"").localeCompare(a.stamp||""))}
function previousRecord(){
 const stamp=recordStamp();
 const arr=history().filter(x=>(x.stamp||"")<stamp);
 return arr[0]||history()[0]||null;
}
function lastSavedPrice(field){const arr=history();for(const x of arr){const v=parseFloat(x[field]);if(Number.isFinite(v))return v}return null}
function estimatePct(newPrice,oldPrice){if(!Number.isFinite(newPrice)||!Number.isFinite(oldPrice)||oldPrice===0)return null;return (newPrice-oldPrice)/oldPrice*100}
function compareScore(today, yesterday){if(today===null || !Number.isFinite(yesterday))return 0;if(today>yesterday)return 1;if(today<yesterday)return -1;return 0}
async function fetchYahoo(symbol){const url=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?range=5d&interval=1d`;const res=await fetch(url);if(!res.ok)throw new Error("Yahoo请求失败 "+res.status);const j=await res.json();const r=j.chart.result[0];const q=r.indicators.quote[0].close.filter(x=>x!==null);const last=q[q.length-1],prev=q[q.length-2];const pc=(Number.isFinite(last)&&Number.isFinite(prev)&&prev!==0)?(last-prev)/prev*100:null;return {price:last,pct:pc}}
async function fetchStooq(symbol){const url=`https://stooq.com/q/l/?s=${encodeURIComponent(symbol)}&f=sd2t2ohlcv&h&e=csv`;const res=await fetch(url);if(!res.ok)throw new Error("Stooq请求失败 "+res.status);const txt=await res.text();const lines=txt.trim().split(/\r?\n/);if(lines.length<2)throw new Error("Stooq无数据");const p=lines[1].split(",");return {price:parseFloat(p[6]),pct:null}}
async function fetchOil(){try{$("fetchStatus").textContent="正在抓取原油...";let wti,brent;if($("source").value==="stooq"){wti=await fetchStooq("cl.f");brent=await fetchStooq("brn.f")}else{wti=await fetchYahoo("CL=F");brent=await fetchYahoo("BZ=F")}if(Number.isFinite(wti.price))$("wti").value=wti.price.toFixed(2);if(Number.isFinite(brent.price))$("brent").value=brent.price.toFixed(2);let wp=wti.pct,bp=brent.pct;if(!Number.isFinite(wp))wp=estimatePct(wti.price,lastSavedPrice("wti"));if(!Number.isFinite(bp))bp=estimatePct(brent.price,lastSavedPrice("brent"));if(Number.isFinite(wp))$("wtiPct").value=wp.toFixed(2);if(Number.isFinite(bp))$("brentPct").value=bp.toFixed(2);$("fetchStatus").textContent="原油已更新。";calc()}catch(e){$("fetchStatus").textContent="自动抓取失败："+e.message+"。可切换行情源或手填。"}}
function calc(){
 const last=previousRecord();
 const oilAvg=((num("wtiPct")??0)+(num("brentPct")??0))/2;
 const oilScore=scoreRange(oilAvg,num("oilHigh")??1.5,num("oilLow")??-1.5);
 const gasCrackScore=scoreRange(num("gasCrack"),num("gasCrackHigh")??18,num("gasCrackLow")??10);
 const dieselCrackScore=scoreRange(num("dieselCrack"),num("dieselCrackHigh")??22,num("dieselCrackLow")??12);
 const gasRatioScore=scoreRange(num("gasRatio"),num("ratioHigh")??100,num("ratioLow")??80);
 const dieselRatioScore=scoreRange(num("dieselRatio"),num("ratioHigh")??100,num("ratioLow")??80);
 const gasAvgScore=compareScore(num("gasAvgPrice"), last?parseFloat(last.gasAvgPrice):NaN);
 const dieselAvgScore=compareScore(num("dieselAvgPrice"), last?parseFloat(last.dieselAvgPrice):NaN);
 const adjustScore=scoreAdjust(num("adjust"));
 const newsScore=parseInt($("news").value||"0",10);
 const total=oilScore+gasCrackScore+dieselCrackScore+gasRatioScore+dieselRatioScore+gasAvgScore+dieselAvgScore+adjustScore+newsScore;
 let decision="观望",hint="震荡区间，少量快进快出。";
 if(total>=7){decision="强多：加库存/锁价";hint="方向、利润、需求或均价共振偏强，可提高备货积极性。"}
 else if(total>=4){decision="偏多：小幅加库存";hint="适度补货，重点看裂解差、产销比、均价能否继续共振。"}
 else if(total<=-7){decision="强空：降库存/延迟采购";hint="下行压力较大，优先控制库存风险。"}
 else if(total<=-4){decision="偏空：少进快出";hint="利润、需求或均价承接偏弱，谨慎采购。"}
 const warning=inventoryWarning({oilScore,gasCrackScore,dieselCrackScore,gasRatioScore,dieselRatioScore,gasAvgScore,dieselAvgScore});
 hint += " " + warning.text;
 $("score").textContent=total;$("decision").textContent=decision;$("hint").textContent=hint;
 $("wtiShow").textContent=fmt(num("wti"));$("brentShow").textContent=fmt(num("brent"));$("wtiChgShow").textContent=pct(num("wtiPct"));$("brentChgShow").textContent=pct(num("brentPct"));
 $("chance").textContent=total>=7?"高":total>=4?"中高":total<=-4?"低":"一般";$("chance").className="pill "+(total>=4?"ok":total<=-4?"bad":"flat");
 $("risk").textContent=warning.level;$("risk").className="pill "+(warning.level==="高"||warning.level==="偏高"?"bad":warning.level==="低"?"ok":"flat");
 $("turning").textContent=warning.label;$("turning").className="pill "+(warning.kind==="bad"?"bad":warning.kind==="ok"?"ok":"info");
 const rows=[
  ["原油趋势",oilScore,`平均涨跌幅 ${oilAvg.toFixed(2)}%`],
  ["汽油裂解",gasCrackScore,"强=+2，弱=-2"],
  ["柴油裂解",dieselCrackScore,"强=+2，弱=-2"],
  ["汽油产销",gasRatioScore,"≥100%强，≤80%弱"],
  ["柴油产销",dieselRatioScore,"≥100%强，≤80%弱"],
  ["汽油均价",gasAvgScore,"比上一条记录涨+1，跌-1"],
  ["柴油均价",dieselAvgScore,"比上一条记录涨+1，跌-1"],
  ["调价预期",adjustScore,"≥50元 +1，≤-50元 -1"],
  ["消息面",newsScore,"利多+2 / 利空-2"]
 ];
 $("scoreRows").innerHTML=rows.map(r=>`<tr><td>${r[0]}</td><td><span class="pill ${r[1]>0?'ok':r[1]<0?'bad':'flat'}">${r[1]}</span></td><td>${r[2]}</td></tr>`).join("");
 saveAll(false);drawChart();return {total,decision,warning};
}
function inventoryWarning(s){
 const crackStrong=(s.gasCrackScore>0||s.dieselCrackScore>0);
 const crackWeak=(s.gasCrackScore<0&&s.dieselCrackScore<0);
 const ratioWeak=(s.gasRatioScore<0||s.dieselRatioScore<0);
 const ratioStrong=(s.gasRatioScore>0||s.dieselRatioScore>0);
 const priceWeak=(s.gasAvgScore<0||s.dieselAvgScore<0);
 const priceStrong=(s.gasAvgScore>0||s.dieselAvgScore>0);
 if(crackStrong && ratioWeak && priceWeak) return {label:"过剩预警",level:"高",kind:"bad",text:"库存拐点预警：裂解差强但产销和均价弱，可能是供给增加、下游承接不足。"};
 if(crackStrong && ratioStrong && priceStrong) return {label:"紧张延续",level:"低",kind:"ok",text:"库存拐点提示：利润、产销、均价共振偏强，市场承接较好。"};
 if(s.oilScore>0 && crackWeak) return {label:"高位风险",level:"偏高",kind:"bad",text:"原油上涨但裂解差转弱，注意高位接盘风险。"};
 if(crackStrong && (ratioWeak||priceWeak)) return {label:"转弱观察",level:"偏高",kind:"bad",text:"裂解差较好但产销或均价已有弱化，注意从利多转利空。"};
 if(ratioStrong && priceStrong) return {label:"需求较好",level:"中",kind:"ok",text:"产销和均价表现较好，需求承接尚可。"};
 return {label:"待观察",level:"中",kind:"info",text:"暂无明显库存拐点，继续观察裂解差、产销比、均价是否共振。"};
}
function saveAll(show=true){const data={};keys.forEach(k=>data[k]=$(k)?.value??"");localStorage.setItem(stateKey,JSON.stringify(data));if(show)$("fetchStatus").textContent="已保存。"}
function loadAll(){const data=JSON.parse(localStorage.getItem(stateKey)||"{}");keys.forEach(k=>{if(data[k]!==undefined&&$(k))$(k).value=data[k]});if(!$("date").value)$("date").value=nowDate();if(!$("time").value)$("time").value=nowTime();renderHistory();calc()}
function saveNow(){
 if(!$("date").value)$("date").value=nowDate();
 if(!$("time").value)$("time").value=nowTime();
 const result=calc();
 const stamp=recordStamp();
 const record={id:stamp+"-"+Date.now(),stamp,date:$("date").value,time:$("time").value,wti:$("wti").value,wtiPct:$("wtiPct").value,brent:$("brent").value,brentPct:$("brentPct").value,gasCrack:$("gasCrack").value,dieselCrack:$("dieselCrack").value,gasRatio:$("gasRatio").value,dieselRatio:$("dieselRatio").value,gasAvgPrice:$("gasAvgPrice").value,dieselAvgPrice:$("dieselAvgPrice").value,adjust:$("adjust").value,news:$("news").value,total:result.total,decision:result.decision,warning:result.warning.label};
 let arr=history();
 arr.push(record);
 arr=arr.sort((a,b)=>(b.stamp||"").localeCompare(a.stamp||"")).slice(0,300);
 localStorage.setItem(storageKey,JSON.stringify(arr));
 renderHistory();drawChart();$("fetchStatus").textContent="已保存当前记录："+stamp;
}
function renderHistory(){const arr=history();$("history").innerHTML=arr.slice(0,12).map(x=>`<tr><td>${(x.stamp||"").slice(5)}</td><td>${x.gasAvgPrice||"--"}</td><td>${x.dieselAvgPrice||"--"}</td><td>${x.total}</td><td>${x.decision}</td></tr>`).join("")||`<tr><td colspan="5" class="small">暂无记录</td></tr>`}
function drawChart(){
 const c=$("chart"),ctx=c.getContext("2d"),mode=$("chartMode").value;
 const arr=history().slice(0,40).reverse();
 ctx.clearRect(0,0,c.width,c.height);
 ctx.strokeStyle="#334155";ctx.lineWidth=1;
 for(let i=0;i<5;i++){let y=24+i*40;ctx.beginPath();ctx.moveTo(34,y);ctx.lineTo(c.width-16,y);ctx.stroke()}
 ctx.fillStyle="#94a3b8";ctx.font="12px Arial";
 const titles={score:"总分趋势",oil:"WTI/Brent价格",avg:"汽油/柴油均价",crack:"汽油/柴油裂解差"};
 ctx.fillText(titles[mode]||"趋势",18,18);
 if(arr.length<2){ctx.fillText("保存两条以上记录后显示趋势",145,115);return}
 let series=[];
 if(mode==="oil"){series=[["WTI","wti","#38bdf8"],["Brent","brent","#a78bfa"]]}
 else if(mode==="avg"){series=[["汽油均价","gasAvgPrice","#22c55e"],["柴油均价","dieselAvgPrice","#facc15"]]}
 else if(mode==="crack"){series=[["汽油裂解","gasCrack","#22c55e"],["柴油裂解","dieselCrack","#facc15"]]}
 else {series=[["总分","total","#38bdf8"]]}
 const allVals=[];
 series.forEach(s=>arr.forEach(x=>{const v=Number(x[s[1]]);if(Number.isFinite(v))allVals.push(v)}));
 if(allVals.length<2){ctx.fillText("该指标记录不足",185,115);return}
 const min=Math.min(...allVals),max=Math.max(...allVals);
 const pad=(max-min)*0.15||1;
 const ymin=min-pad,ymax=max+pad;
 const xstep=(c.width-58)/(arr.length-1);
 function y(v){return 198-(v-ymin)/(ymax-ymin)*160}
 series.forEach(s=>{
  ctx.strokeStyle=s[2];ctx.lineWidth=3;ctx.beginPath();let started=false;
  arr.forEach((x,i)=>{const v=Number(x[s[1]]);if(!Number.isFinite(v))return;const xx=34+i*xstep,yy=y(v);if(!started){ctx.moveTo(xx,yy);started=true}else ctx.lineTo(xx,yy)});
  ctx.stroke();
 });
