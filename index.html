<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="原油决策">
  <title>原油汽柴油无Token决策板</title>
  <style>
    :root{
      --bg:#0f172a;--card:#111827;--line:#334155;--text:#f8fafc;--muted:#94a3b8;
      --blue:#38bdf8;--green:#22c55e;--red:#ef4444;--yellow:#facc15;--orange:#fb923c;
    }
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#0f172a,#020617);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .wrap{max-width:520px;margin:0 auto;padding:14px 14px 92px}
    h1{font-size:22px;margin:14px 0 6px}
    .sub{color:var(--muted);font-size:13px;margin-bottom:12px;line-height:1.5}
    .card{background:rgba(17,24,39,.92);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 10px 25px rgba(0,0,0,.18)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    label{font-size:12px;color:var(--muted);display:block;margin:4px 0 6px}
    input,select,button{width:100%;border-radius:12px;border:1px solid var(--line);background:#020617;color:var(--text);padding:12px;font-size:16px;outline:none}
    input:focus,select:focus{border-color:var(--blue)}
    button{border:0;background:linear-gradient(135deg,#0284c7,#38bdf8);font-weight:700;color:white;cursor:pointer}
    button.secondary{background:#1f2937;color:#e5e7eb;border:1px solid var(--line)}
    button.danger{background:#7f1d1d}
    .pricebox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .price{background:#020617;border:1px solid var(--line);border-radius:16px;padding:12px}
    .price .name{font-size:12px;color:var(--muted)}
    .price .val{font-size:26px;font-weight:800;margin-top:4px}
    .price .chg{font-size:13px;margin-top:2px}
    .pill{display:inline-block;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}
    .ok{background:rgba(34,197,94,.18);color:#86efac}.bad{background:rgba(239,68,68,.18);color:#fecaca}.flat{background:rgba(250,204,21,.15);color:#fde68a}
    .score{font-size:46px;font-weight:900;line-height:1;text-align:center}
    .decision{text-align:center;font-size:22px;font-weight:900;margin-top:8px}
    .hint{text-align:center;color:var(--muted);font-size:13px;margin-top:8px;line-height:1.5}
    table{width:100%;border-collapse:collapse;font-size:13px}
    td,th{border-bottom:1px solid var(--line);padding:9px 4px;text-align:center}
    th{color:var(--muted);font-weight:600}
    .bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(2,6,23,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
    .bottom .inner{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
    .small{font-size:12px;color:var(--muted);line-height:1.5}
    .hide{display:none}
    .tag{font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
<div class="wrap">
  <h1>原油汽柴油无 Token 决策板</h1>
  <div class="sub">自动抓 WTI / Brent；汽油裂解差、柴油裂解差、汽油产销比、柴油产销比手填。无需注册 Token。</div>

  <div class="card">
    <div class="row">
      <div>
        <label>日期</label>
        <input id="date" type="date">
      </div>
      <div>
        <label>行情源</label>
        <select id="source" onchange="saveAll(false)">
          <option value="yahoo">Yahoo公开行情</option>
          <option value="stooq">Stooq公开行情</option>
        </select>
      </div>
    </div>
    <div class="row" style="margin-top:10px">
      <button onclick="fetchOil()">自动抓原油</button>
      <button class="secondary" onclick="toggleSettings()">参数设置</button>
    </div>
    <div class="small" id="fetchStatus" style="margin-top:8px">无 Token 版依赖公开行情源，若手机网络限制导致失败，可手填价格继续使用。</div>
  </div>

  <div id="settings" class="card hide">
    <div class="row">
      <div><label>汽油裂解强</label><input id="gasCrackHigh" type="number" value="18"></div>
      <div><label>汽油裂解弱</label><input id="gasCrackLow" type="number" value="10"></div>
    </div>
    <div class="row">
      <div><label>柴油裂解强</label><input id="dieselCrackHigh" type="number" value="22"></div>
      <div><label>柴油裂解弱</label><input id="dieselCrackLow" type="number" value="12"></div>
    </div>
    <div class="row">
      <div><label>产销强%</label><input id="ratioHigh" type="number" value="100"></div>
      <div><label>产销弱%</label><input id="ratioLow" type="number" value="80"></div>
    </div>
    <div class="row">
      <div><label>原油涨幅强%</label><input id="oilHigh" type="number" value="1.5"></div>
      <div><label>原油跌幅强%</label><input id="oilLow" type="number" value="-1.5"></div>
    </div>
    <button class="secondary" onclick="saveAll()" style="margin-top:10px">保存参数</button>
  </div>

  <div class="card">
    <div class="pricebox">
      <div class="price">
        <div class="name">WTI</div>
        <div class="val" id="wtiShow">--</div>
        <div class="chg" id="wtiChgShow">--</div>
      </div>
      <div class="price">
        <div class="name">Brent</div>
        <div class="val" id="brentShow">--</div>
        <div class="chg" id="brentChgShow">--</div>
      </div>
    </div>
    <div class="row" style="margin-top:10px">
      <div><label>WTI价格</label><input id="wti" type="number" step="0.01" oninput="calc()"></div>
      <div><label>WTI涨跌幅%</label><input id="wtiPct" type="number" step="0.01" oninput="calc()"></div>
    </div>
    <div class="row">
      <div><label>Brent价格</label><input id="brent" type="number" step="0.01" oninput="calc()"></div>
      <div><label>Brent涨跌幅%</label><input id="brentPct" type="number" step="0.01" oninput="calc()"></div>
    </div>
    <div class="small" style="margin-top:8px">涨跌幅：优先用行情源返回；若没有返回，则用你上一次保存的价格自动估算。</div>
  </div>

  <div class="card">
    <div class="row">
      <div><label>汽油裂解差</label><input id="gasCrack" type="number" step="0.01" oninput="calc()"></div>
      <div><label>柴油裂解差</label><input id="dieselCrack" type="number" step="0.01" oninput="calc()"></div>
    </div>
    <div class="row">
      <div><label>汽油产销比%</label><input id="gasRatio" type="number" step="0.1" oninput="calc()"></div>
      <div><label>柴油产销比%</label><input id="dieselRatio" type="number" step="0.1" oninput="calc()"></div>
    </div>
    <div class="row">
      <div><label>调价预期 元/吨</label><input id="adjust" type="number" step="1" oninput="calc()"></div>
      <div>
        <label>消息面</label>
        <select id="news" onchange="calc()">
          <option value="0">无明显消息 0</option>
          <option value="2">利多 +2</option>
          <option value="-2">利空 -2</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="score" id="score">0</div>
    <div class="decision" id="decision">观望</div>
    <div class="hint" id="hint">填写数据后自动判断。</div>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>项目</th><th>评分</th><th>说明</th></tr></thead>
      <tbody id="scoreRows"></tbody>
    </table>
  </div>

  <div class="card">
    <div class="row">
      <button onclick="saveToday()">保存今天</button>
      <button class="secondary" onclick="exportCsv()">导出CSV</button>
    </div>
    <button class="danger" onclick="clearHistory()" style="margin-top:10px">清空历史记录</button>
  </div>

  <div class="card">
    <div style="font-weight:800;margin-bottom:8px">最近记录</div>
    <table>
      <thead><tr><th>日期</th><th>WTI</th><th>Brent</th><th>分数</th><th>策略</th></tr></thead>
      <tbody id="history"></tbody>
    </table>
  </div>
</div>

<div class="bottom">
  <div class="inner">
    <button onclick="calc()">计算</button>
    <button class="secondary" onclick="saveToday()">保存</button>
    <button class="secondary" onclick="window.scrollTo({top:0,behavior:'smooth'})">顶部</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const keys = ["date","source","wti","wtiPct","brent","brentPct","gasCrack","dieselCrack","gasRatio","dieselRatio","adjust","news","gasCrackHigh","gasCrackLow","dieselCrackHigh","dieselCrackLow","ratioHigh","ratioLow","oilHigh","oilLow"];
function num(id){ const v=parseFloat($(id).value); return Number.isFinite(v)?v:null; }
function fmt(v){ return v===null || v==="" ? "--" : Number(v).toFixed(2); }
function pct(v){ return v===null || v==="" ? "--" : Number(v).toFixed(2)+"%"; }
function scoreRange(value, high, low, highScore=2, lowScore=-2){
  if(value===null) return 0;
  if(value>=high) return highScore;
  if(value<=low) return lowScore;
  return 0;
}
function scoreAdjust(v){
  if(v===null) return 0;
  if(v>=50) return 1;
  if(v<=-50) return -1;
  return 0;
}
function lastSavedPrice(field){
  const arr=JSON.parse(localStorage.getItem("oilNoTokenHistory")||"[]");
  for(const x of arr){
    const v=parseFloat(x[field]);
    if(Number.isFinite(v)) return v;
  }
  return null;
}
function estimatePct(newPrice, oldPrice){
  if(!Number.isFinite(newPrice) || !Number.isFinite(oldPrice) || oldPrice===0) return null;
  return (newPrice-oldPrice)/oldPrice*100;
}
async function fetchYahoo(symbol){
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?range=5d&interval=1d`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("Yahoo请求失败 "+res.status);
  const j = await res.json();
  const r = j.chart.result[0];
  const q = r.indicators.quote[0].close.filter(x=>x!==null);
  const last = q[q.length-1], prev = q[q.length-2];
  const pct = (Number.isFinite(last)&&Number.isFinite(prev)&&prev!==0) ? (last-prev)/prev*100 : null;
  return {price:last, pct};
}
async function fetchStooq(symbol){
  const url = `https://stooq.com/q/l/?s=${encodeURIComponent(symbol)}&f=sd2t2ohlcv&h&e=csv`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("Stooq请求失败 "+res.status);
  const txt = await res.text();
  const lines = txt.trim().split(/\r?\n/);
  if(lines.length<2) throw new Error("Stooq无数据");
  const parts = lines[1].split(",");
  const close = parseFloat(parts[6]);
  return {price:close, pct:null};
}
async function fetchOil(){
  try{
    $("fetchStatus").textContent="正在自动抓取原油...";
    let wti, brent;
    if($("source").value==="stooq"){
      wti = await fetchStooq("cl.f");
      brent = await fetchStooq("brn.f");
    }else{
      wti = await fetchYahoo("CL=F");
      brent = await fetchYahoo("BZ=F");
    }

    if(Number.isFinite(wti.price)) $("wti").value = wti.price.toFixed(2);
    if(Number.isFinite(brent.price)) $("brent").value = brent.price.toFixed(2);

    let wp = wti.pct;
    let bp = brent.pct;
    if(!Number.isFinite(wp)) wp = estimatePct(wti.price, lastSavedPrice("wti"));
    if(!Number.isFinite(bp)) bp = estimatePct(brent.price, lastSavedPrice("brent"));
    if(Number.isFinite(wp)) $("wtiPct").value = wp.toFixed(2);
    if(Number.isFinite(bp)) $("brentPct").value = bp.toFixed(2);

    $("fetchStatus").textContent="原油已更新。若涨跌幅为空，请保存一次后下次会按上次价格估算，或手填。";
    calc();
  }catch(e){
    $("fetchStatus").textContent="自动抓取失败："+e.message+"。可切换行情源或手填价格继续使用。";
  }
}
function calc(){
  const oilAvg = ((num("wtiPct")??0)+(num("brentPct")??0))/2;
  const oilScore = scoreRange(oilAvg, num("oilHigh")??1.5, num("oilLow")??-1.5);
  const gasCrackScore = scoreRange(num("gasCrack"), num("gasCrackHigh")??18, num("gasCrackLow")??10);
  const dieselCrackScore = scoreRange(num("dieselCrack"), num("dieselCrackHigh")??22, num("dieselCrackLow")??12);
  const gasRatioScore = scoreRange(num("gasRatio"), num("ratioHigh")??100, num("ratioLow")??80);
  const dieselRatioScore = scoreRange(num("dieselRatio"), num("ratioHigh")??100, num("ratioLow")??80);
  const adjustScore = scoreAdjust(num("adjust"));
  const newsScore = parseInt($("news").value||"0",10);
  const total = oilScore + gasCrackScore + dieselCrackScore + gasRatioScore + dieselRatioScore + adjustScore + newsScore;

  let decision="观望", hint="震荡区间，少量快进快出。";
  if(total>=6){ decision="强多：加库存/锁价"; hint="原油、利润或供需共振偏强，可提高备货积极性。"; }
  else if(total>=3){ decision="偏多：小幅加库存"; hint="可以适度补货，但要看裂解差是否继续增强。"; }
  else if(total<=-6){ decision="强空：降库存/延迟采购"; hint="下行压力较大，优先控制库存风险。"; }
  else if(total<=-3){ decision="偏空：少进快出"; hint="需求或利润偏弱，谨慎采购。"; }

  if(oilScore>0 && gasCrackScore<0 && dieselCrackScore<0) hint += " 特别注意：原油涨但裂解差弱，容易高位接盘。";
  if((gasCrackScore>0 || dieselCrackScore>0) && (gasRatioScore>0 || dieselRatioScore>0)) hint += " 利润与产销至少一端共振，机会质量较好。";

  $("score").textContent = total;
  $("decision").textContent = decision;
  $("hint").textContent = hint;
  $("wtiShow").textContent = fmt(num("wti"));
  $("brentShow").textContent = fmt(num("brent"));
  $("wtiChgShow").textContent = pct(num("wtiPct"));
  $("brentChgShow").textContent = pct(num("brentPct"));

  const rows = [
    ["原油趋势", oilScore, `WTI/Brent平均涨跌幅 ${oilAvg.toFixed(2)}%`],
    ["汽油裂解", gasCrackScore, "强=+2，弱=-2"],
    ["柴油裂解", dieselCrackScore, "强=+2，弱=-2"],
    ["汽油产销", gasRatioScore, "≥100%强，≤80%弱"],
    ["柴油产销", dieselRatioScore, "≥100%强，≤80%弱"],
    ["调价预期", adjustScore, "≥50元 +1，≤-50元 -1"],
    ["消息面", newsScore, "利多+2 / 利空-2"]
  ];
  $("scoreRows").innerHTML = rows.map(r=>`<tr><td>${r[0]}</td><td><span class="pill ${r[1]>0?'ok':r[1]<0?'bad':'flat'}">${r[1]}</span></td><td>${r[2]}</td></tr>`).join("");
  saveAll(false);
  return {total, decision};
}
function saveAll(show=true){
  const data={}; keys.forEach(k=>data[k]=$(k)?.value??"");
  localStorage.setItem("oilNoTokenState", JSON.stringify(data));
  if(show) $("fetchStatus").textContent = "已保存。";
}
function loadAll(){
  const data=JSON.parse(localStorage.getItem("oilNoTokenState")||"{}");
  keys.forEach(k=>{ if(data[k]!==undefined && $(k)) $(k).value=data[k]; });
  if(!$("date").value) $("date").value = new Date().toISOString().slice(0,10);
  renderHistory(); calc();
}
function saveToday(){
  const result = calc();
  const record = {
    date:$("date").value,
    wti:$("wti").value,wtiPct:$("wtiPct").value,brent:$("brent").value,brentPct:$("brentPct").value,
    gasCrack:$("gasCrack").value,dieselCrack:$("dieselCrack").value,gasRatio:$("gasRatio").value,dieselRatio:$("dieselRatio").value,
    adjust:$("adjust").value,news:$("news").value,total:result.total,decision:result.decision
  };
  let arr=JSON.parse(localStorage.getItem("oilNoTokenHistory")||"[]");
  arr = arr.filter(x=>x.date!==record.date);
  arr.unshift(record);
  arr = arr.slice(0,120);
  localStorage.setItem("oilNoTokenHistory", JSON.stringify(arr));
  renderHistory();
  $("fetchStatus").textContent="今天记录已保存。";
}
function renderHistory(){
  const arr=JSON.parse(localStorage.getItem("oilNoTokenHistory")||"[]");
  $("history").innerHTML = arr.slice(0,10).map(x=>`<tr><td>${x.date}</td><td>${x.wti||"--"}</td><td>${x.brent||"--"}</td><td>${x.total}</td><td>${x.decision}</td></tr>`).join("") || `<tr><td colspan="5" class="tag">暂无记录</td></tr>`;
}
function exportCsv(){
  const arr=JSON.parse(localStorage.getItem("oilNoTokenHistory")||"[]");
  const header=["日期","WTI","WTI涨跌%","Brent","Brent涨跌%","汽油裂解","柴油裂解","汽油产销%","柴油产销%","调价预期","消息面","总分","策略"];
  const rows=arr.map(x=>[x.date,x.wti,x.wtiPct,x.brent,x.brentPct,x.gasCrack,x.dieselCrack,x.gasRatio,x.dieselRatio,x.adjust,x.news,x.total,x.decision]);
  const csv=[header,...rows].map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\n");
  const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="原油决策记录.csv";
  a.click();
}
function clearHistory(){
  if(confirm("确定清空历史记录？")){
    localStorage.removeItem("oilNoTokenHistory");
    renderHistory();
  }
}
function toggleSettings(){ $("settings").classList.toggle("hide"); }
loadAll();
</script>
</body>
</html>
